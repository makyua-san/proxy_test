<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Proxy Monitor</h1>
    <div class="connection-status" id="connStatus">Connecting...</div>
  </header>

  <main>
    <aside class="sidebar-panel">
      <div class="sidebar-section">
        <h2>Whitelist</h2>
        <form id="addForm" class="add-form">
          <input type="text" id="domainInput" placeholder="example.com or *.example.com" required>
          <button type="submit">Add</button>
        </form>
        <ul id="whitelistItems"></ul>
      </div>
      <hr class="sidebar-divider">
      <div class="sidebar-section">
        <h2>Monitor List</h2>
        <form id="monitorAddForm" class="add-form">
          <input type="text" id="monitorDomainInput" placeholder="example.com or *.example.com" required>
          <button type="submit" class="monitor-btn">Add</button>
        </form>
        <ul id="monitorListItems"></ul>
      </div>
    </aside>

    <section class="log-panel">
      <div class="log-toolbar">
        <h2>Request Log</h2>
        <div class="log-actions">
          <label><input type="checkbox" id="filterMonitored"> Monitored only</label>
          <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
          <button id="clearLog">Clear Log</button>
        </div>
      </div>
      <div class="log-container" id="logContainer">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Monitor</th>
              <th>Method</th>
              <th>Host</th>
              <th>Port</th>
              <th>Status</th>
              <th>Matched Rule</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </section>

    <aside class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <h2>Request Detail</h2>
        <button id="closeDetail">&times;</button>
      </div>
      <div class="detail-content" id="detailContent"></div>
    </aside>
  </main>

  <footer id="statsBar">
    Total: <span id="statTotal">0</span> |
    Allowed: <span id="statAllowed">0</span> |
    Blocked: <span id="statBlocked">0</span> |
    Monitored: <span id="statMonitored">0</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
